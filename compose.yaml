services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-confession_app}
      POSTGRES_USER: ${POSTGRES_USER:-confession_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confession_app_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - confession_postgres_data:/var/lib/postgresql

volumes:
  confession_postgres_data:
